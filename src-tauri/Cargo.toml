[package]
name = "work-duo"
version = "0.0.1"
description = "A Tauri App"
authors = ["AngleBracketStudio"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "work_duo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-sql = { version = "2.0.0", features = ["sqlite"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
regex = "1"    # 原生工具 regex_replace（Rust regex 语法，线性时间无 ReDoS）
futures-util = "0.3"
tauri-plugin-shell = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "rt", "time", "process"] }
chrono = "0.4"
# 统一日志框架（L0/L1 通用基础设施，领域无关）：tracing = slf4j 门面，tracing-subscriber = 订阅器，tracing-appender = 滚动文件落盘。
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# zip 读写（含 deflate 压缩，自带 flate2，无需单独引入）；首梯队原生工具 zip_create / zip_extract 依赖。
zip = "2"

