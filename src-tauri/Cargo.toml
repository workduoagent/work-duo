[package]
name = "work-duo"
version = "0.0.1"
description = "本地优先的 AI 智能体工作台 —— 模型接入、智能体编排、多智能体协作与沙箱执行"
authors = ["AngleBracketStudio"]
license = "MIT"
repository = "https://github.com/workduoagent/work-duo"
homepage = "https://github.com/workduoagent/work-duo"
edition = "2021"
keywords = ["ai", "agent", "llm", "tauri", "mcp", "sandbox", "local-first"]
categories = ["development-tools"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "work_duo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-sql = { version = "2.0.0", features = ["sqlite"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
regex = "1"    # 原生工具 regex_replace（Rust regex 语法，线性时间无 ReDoS）
futures-util = "0.3"
tauri-plugin-shell = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "rt", "time", "process"] }
chrono = "0.4"
# 统一日志框架（L0/L1 通用基础设施，领域无关）：tracing = slf4j 门面，tracing-subscriber = 订阅器，tracing-appender = 滚动文件落盘。
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# zip 读写（含 deflate 压缩，自带 flate2，无需单独引入）；首梯队原生工具 zip_create / zip_extract 依赖。
zip = "2"
# 统一向量存储（记忆系统 v2）：嵌入式 LanceDB。
# 注意：0.38/0.39 上游 bug —— Error::Http 变体在 `remote` feature 门内，而 job.rs
# 无条件引用 → 默认 features 编不过，必须启用 remote（上游修复后可移除）。
lancedb = { version = "0.38.0", features = ["remote"] }
arrow = "58"
arrow-array = "58"
arrow-schema = "58"
arrow-buffer = "58"

# ---------------- 服务器托管（Host，设计稿 docs/server-hosting-design.md） ----------------
# SSH/SFTP 传输：russh 纯 Rust + tokio 原生（与 agent 异步运行时同构，无 C 编译风险）。
russh = "0.46"
russh-keys = "0.46"
russh-sftp = "2"
# 凭证加密：AES-256-GCM 密文；主密钥存 OS 凭据管理器（keyring）。
aes-gcm = "0.10"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
hex = "0.4"
md-5 = "0.10"
# MCP OAuth2：PKCE(S256) 与随机会话状态
sha2 = "0.10"
# F003 follow-up：持久目录 fs scope 授权凭据的 HMAC-SHA256 签名（密钥在 OS 凭据管理器）
hmac = "0.12"
rand = "0.8"
