<!-- AI生成 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>小分队列表 & 编辑表单 · UI 设计稿</title>
<style>
:root{
  --bg:#ffffff; --bg-subtle:#fafafa; --bg-muted:#f4f4f5;
  --fg:#27272a; --fg-muted:#71717a; --fg-intense:#18181b;
  --border:#e4e4e7; --border-muted:#f4f4f5;
  --brand-50:#f0f9ff; --brand-100:#e0f2fe; --brand-200:#bae6fd;
  --brand-300:#7dd3fc; --brand-400:#38bdf8; --brand-500:#0ea5e9; --brand-600:#0284c7;
  --brand-700:#0369a1; --brand-800:#075985;
  --success:#16a34a; --success-50:#dcfce7;
  --warning:#d97706; --warning-50:#fef3c7;
  --danger:#ef4444; --danger-50:#fee2e2;
  --purple:#8b5cf6; --purple-50:#f5f3ff;
  --shadow-sm:0 2px 12px rgba(0,0,0,.03);
  --shadow-md:0 8px 32px rgba(0,0,0,.05);
  --shadow-pop:0 16px 48px rgba(0,0,0,.1);
  --radius:12px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--fg);font-size:13px;line-height:1.5;overflow:hidden}

/* lucide 风格线性图标 */
.ic{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic--sm{width:13px;height:13px}
.ic--md{width:16px;height:16px}
.ic--lg{width:20px;height:20px}

.page{display:flex;flex-direction:column;height:100vh;padding:20px 28px 28px;overflow-y:auto}

/* ===== 页头 ===== */
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}
.head__title{font-size:22px;font-weight:700;color:var(--fg-intense);letter-spacing:-.02em}
.head__lead{margin:6px 0 0;font-size:13.5px;color:var(--fg-muted);max-width:520px;line-height:1.65}
.head__actions{display:flex;align-items:center;gap:10px;flex:none}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border-radius:10px;border:1px solid transparent;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:600;
  padding:0 16px;height:36px;transition:.15s;white-space:nowrap;
}
.btn--solid{background:var(--brand-600);color:#fff;box-shadow:0 2px 8px color-mix(in srgb,var(--brand-500) 30%,transparent)}
.btn--solid:hover{background:var(--brand-700)}
.btn--soft{background:var(--brand-50);color:var(--brand-700);border-color:var(--brand-200)}
.btn--soft:hover{background:var(--brand-100)}
.btn--ghost{background:transparent;color:var(--fg-muted);border-color:var(--border)}
.btn--ghost:hover{border-color:var(--brand-300);color:var(--brand-700);background:var(--brand-50)}
.btn--outline{background:var(--bg);color:var(--fg);border-color:var(--border)}
.btn--danger-ghost{background:transparent;color:var(--danger);border-color:transparent}
.btn--danger-ghost:hover{background:var(--danger-50)}
.btn--sm{height:32px;padding:0 12px;font-size:12px}
.btn--icon{width:34px;height:34px;padding:0}
.btn--icon.btn--sm{width:28px;height:28px}

.pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;
}
.pill--mode{background:var(--brand-100);color:var(--brand-800)}
.pill--mode-pipe{background:#ecfeff;color:#0e7490}
.pill--mode-chat{background:var(--purple-50);color:#6d28d9}
.pill--live{background:var(--success-50);color:#16a34a}
.pill--live-warn{background:var(--warning-50);color:var(--warning)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill--live .dot{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ===== 卡片 ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{
  background:var(--bg);border:1px solid var(--border);border-radius:16px;
  padding:18px;display:flex;flex-direction:column;gap:14px;
  transition:.18s;
}
.card:hover{border-color:var(--brand-300);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.card__head{display:flex;align-items:center;gap:12px}
.card__avatar{
  width:48px;height:48px;border-radius:13px;flex:none;
  background:var(--bg-muted);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;color:var(--fg-muted);
}
.card__avatar img{width:100%;height:100%;object-fit:cover}
.card__titles{min-width:0;flex:1}
.card__name{font-size:15px;font-weight:700;color:var(--fg-intense);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card__tags{display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap}
.card__desc{
  font-size:12.5px;color:var(--fg-muted);line-height:1.65;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px;
}
.card__crew{display:flex;align-items:center;height:28px;gap:0}
.card__crew-slot{
  width:26px;height:26px;border-radius:8px;overflow:hidden;
  background:var(--bg-muted);border:2px solid var(--bg);margin-left:-6px;flex:none;
  display:flex;align-items:center;justify-content:center;
}
.card__crew-slot:first-child{margin-left:0}
.card__crew-slot img{width:100%;height:100%;object-fit:cover}
.card__crew-more{margin-left:8px;font-size:11px;font-weight:600;color:var(--fg-muted)}
.card__foot{
  display:flex;align-items:center;gap:8px;
  padding-top:14px;border-top:1px solid var(--border-muted);margin-top:auto;
}

/* ===== 弹窗 ===== */
.mask{
  position:fixed;inset:0;z-index:100;
  background:rgba(24,24,27,.4);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.modal{
  width:min(940px,100%);max-height:calc(100vh - 48px);
  background:var(--bg);border-radius:18px;box-shadow:var(--shadow-pop);
  display:flex;flex-direction:column;overflow:hidden;
}
.modal__head{
  display:flex;align-items:flex-start;gap:14px;
  padding:22px 26px 18px;border-bottom:1px solid var(--border-muted);
}
.modal__title{font-size:17px;font-weight:700;color:var(--fg-intense)}
.modal__desc{margin-top:4px;font-size:12.5px;color:var(--fg-muted)}
.modal__close{
  margin-left:auto;width:32px;height:32px;border-radius:9px;
  border:1px solid var(--border);background:var(--bg);
  cursor:pointer;color:var(--fg-muted);
  display:flex;align-items:center;justify-content:center;
}
.modal__close:hover{background:var(--bg-muted);color:var(--fg)}
.modal__body{flex:1;min-height:0;overflow-y:auto}
.modal__foot{
  display:flex;align-items:center;justify-content:flex-end;gap:10px;
  padding:16px 26px;border-top:1px solid var(--border-muted);background:var(--bg-subtle);
}

/* ===== 编辑器：左侧栏导航 + 右侧表单 ===== */
.editor{display:flex;min-height:0;width:100%;flex:1}
.editor__nav{
  width:188px;flex:none;padding:20px 12px;
  border-right:1px solid var(--border-muted);
  background:var(--bg-subtle);
  display:flex;flex-direction:column;gap:4px;
}
.editor__nav-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 13px;border-radius:10px;
  font-size:13px;font-weight:600;color:var(--fg-muted);
  cursor:pointer;transition:.12s;border:1.5px solid transparent;
}
.editor__nav-item:hover{background:var(--bg);color:var(--fg)}
.editor__nav-item.is-on{
  background:var(--brand-50);color:var(--brand-800);
  border-color:var(--brand-200);
}
.editor__nav-item .ic{opacity:.75}
.editor__nav-item.is-on .ic{opacity:1}
.editor__nav-item small{
  margin-left:auto;font-size:10px;font-weight:700;
  background:var(--brand-600);color:#fff;
  padding:1px 7px;border-radius:999px;
}
.editor__nav-sep{
  margin:10px 8px 6px;font-size:10px;font-weight:650;
  color:var(--fg-muted);letter-spacing:.06em;text-transform:uppercase;
}
.editor__form{
  flex:1;min-width:0;padding:24px 28px 28px;
  overflow-y:auto;display:flex;flex-direction:column;gap:18px;
}

/* 表单 */
.field{display:flex;flex-direction:column;gap:6px}
.field__label{font-size:12.5px;font-weight:650;color:var(--fg-intense);display:flex;align-items:center;gap:5px}
.field__label .tip{color:var(--fg-muted);cursor:help;display:inline-flex}
.field__hint{font-size:11px;color:var(--fg-muted);line-height:1.5}
.input,.select,.textarea{
  width:100%;border:1.5px solid var(--border);border-radius:10px;
  padding:10px 12px;font-family:inherit;font-size:13px;
  color:var(--fg);background:var(--bg);outline:none;transition:.15s;
}
.input:focus,.select:focus,.textarea:focus{
  border-color:var(--brand-500);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-500) 18%,transparent);
}
.input::placeholder,.textarea::placeholder{color:var(--fg-muted);opacity:.65}
.textarea{resize:vertical;min-height:80px;line-height:1.6}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field-row--3{grid-template-columns:1fr 1fr 1fr}

/* 模式 Segmented（对齐现有 Segmented 控件） */
.segmented{
  display:inline-flex;border:1px solid var(--border);border-radius:10px;
  overflow:hidden;background:var(--bg-subtle);
}
.segmented__item{
  display:flex;align-items:center;gap:6px;
  padding:8px 16px;font-size:12.5px;font-weight:600;color:var(--fg-muted);cursor:pointer;
}
.segmented__item+.segmented__item{border-left:1px solid var(--border)}
.segmented__item.is-on{background:var(--brand-600);color:#fff}

/* 头像上传（用户上传，非像素） */
.avatar-pick{display:flex;align-items:center;gap:14px}
.avatar-pick__box{
  width:64px;height:64px;border-radius:16px;flex:none;
  border:1.5px dashed var(--brand-300);
  background:var(--brand-50);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  cursor:pointer;color:var(--brand-600);transition:.15s;
}
.avatar-pick__box:hover{border-color:var(--brand-500);background:var(--brand-100)}
.avatar-pick__box img{width:100%;height:100%;object-fit:cover;border-radius:15px}
.avatar-pick__box small{font-size:9px;font-weight:600}
.avatar-pick__meta{display:flex;flex-direction:column;gap:6px}

/* 成员列表 */
.member-list{display:flex;flex-direction:column;gap:10px}
.member-card{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;background:var(--bg);transition:.15s;
}
.member-card:hover{border-color:var(--brand-300);box-shadow:var(--shadow-sm)}
.member-card__av{
  width:40px;height:40px;border-radius:11px;overflow:hidden;flex:none;
  background:var(--bg-muted);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--fg-muted);
}
.member-card__av img{width:100%;height:100%;object-fit:cover}
.member-card__info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.member-card__name{font-size:13px;font-weight:650;color:var(--fg-intense)}
.member-card__id{font-size:11px;color:var(--fg-muted)}
.member-card__selects{display:flex;gap:8px;flex:none}
.member-card__selects .select{width:140px;padding:7px 10px;font-size:12px}
.member-card__del{
  width:28px;height:28px;border-radius:8px;border:none;
  background:transparent;color:var(--fg-muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.member-card__del:hover{background:var(--danger-50);color:var(--danger)}
.add-member{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;border:1.5px dashed var(--border);border-radius:12px;background:var(--bg-subtle);
}
.add-member .select{flex:1}

/* 开关行 */
.switch-row{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;background:var(--bg);
}
.switch-row__t{font-size:13px;font-weight:650;color:var(--fg-intense)}
.switch-row__d{font-size:11px;color:var(--fg-muted);margin-top:2px}
.switch{
  width:40px;height:22px;border-radius:999px;background:var(--border);
  position:relative;cursor:pointer;transition:.15s;flex:none;
}
.switch::after{
  content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;
  border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:.15s;
}
.switch.is-on{background:var(--brand-600)}
.switch.is-on::after{left:20px}

/* 模式提示条 */
.mode-note{
  display:flex;align-items:center;gap:8px;
  padding:10px 13px;border-radius:10px;
  background:var(--brand-50);border:1px solid var(--brand-200);
  font-size:12px;color:var(--brand-800);
}
.mode-note b{font-weight:700}

/* MCP 卡片：工具可折叠 + 内滚，工具多也不崩 */
.mcp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.mcp-card{
  border:1.5px solid var(--border);border-radius:12px;background:var(--bg);
  padding:0;overflow:hidden;display:flex;flex-direction:column;
}
.mcp-card__head{
  display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;
}
.mcp-card__head:hover{background:var(--bg-subtle)}
.mcp-card__title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:650;color:var(--fg-intense);min-width:0;flex:1}
.mcp-card__title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcp-card__count{
  font-size:10px;font-weight:650;padding:2px 7px;border-radius:999px;
  background:var(--bg-muted);color:var(--fg-muted);flex:none;
}
.mcp-card__count.is-on{background:var(--brand-100);color:var(--brand-800)}
.mcp-card__chev{color:var(--fg-muted);transition:transform .18s;flex:none}
.mcp-card.is-open .mcp-card__chev{transform:rotate(90deg)}
.mcp-card__tools{
  display:none;flex-direction:column;gap:2px;
  border-top:1px solid var(--border-muted);
  padding:8px 10px 10px;
  max-height:220px;overflow-y:auto;
}
.mcp-card.is-open .mcp-card__tools{display:flex}
.mcp-card__tools::-webkit-scrollbar{width:6px}
.mcp-card__tools::-webkit-scrollbar-thumb{background:var(--border);border-radius:999px}
.mcp-card__toolbar{
  display:flex;align-items:center;gap:6px;padding:2px 4px 6px;
  position:sticky;top:0;background:var(--bg);z-index:1;
}
.mcp-card__toolbar button{
  border:none;background:transparent;font-size:11px;font-weight:600;
  color:var(--brand-600);cursor:pointer;padding:2px 6px;border-radius:5px;
}
.mcp-card__toolbar button:hover{background:var(--brand-50)}
.tool-row{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:6px 8px;border-radius:7px;font-size:12px;color:var(--fg);
}
.tool-row:hover{background:var(--bg-subtle)}
.tool-row code{
  font-size:11px;font-family:ui-monospace,Consolas,monospace;
  background:var(--bg-muted);padding:1px 5px;border-radius:4px;color:var(--fg-muted);
}

.tpl-select{
  height:36px;border:1.5px solid var(--border);border-radius:10px;
  padding:0 12px;font-family:inherit;font-size:13px;background:var(--bg);color:var(--fg);min-width:150px;
}

.note{
  position:fixed;left:16px;bottom:12px;z-index:200;
  background:rgba(24,24,27,.9);color:#fafafa;font-size:11px;
  padding:8px 12px;border-radius:8px;max-width:380px;line-height:1.6;pointer-events:none;
}
.note b{color:#7dd3fc}
</style>
</head>

<div class="page">
  <header class="head">
    <div>
      <h1 class="head__title">小分队协作</h1>
      <p class="head__lead">把多个智能体编成协作小组，按需选择编排式 / 流水线 / 群聊，协同攻克复杂任务。</p>
    </div>
    <div class="head__actions">
      <select class="tpl-select"><option>从模板新建</option><option>全栈交付小队</option><option>数据管道小队</option><option>调研小队</option></select>
      <button class="btn btn--ghost"><svg class="ic"><use href="#i-server"/></svg> API 服务</button>
      <button class="btn btn--solid" id="btnCreate"><svg class="ic"><use href="#i-plus"/></svg> 新建小分队</button>
    </div>
  </header>

  <div class="grid" id="grid"></div>
</div>

<!-- 编辑弹窗 -->
<div class="mask" id="mask" style="display:none">
  <div class="modal">
    <div class="modal__head">
      <div>
        <div class="modal__title" id="modalTitle">新建小分队</div>
        <div class="modal__desc">组合多个智能体，按不同协作模式协同完成复杂任务。</div>
      </div>
      <button class="modal__close" id="modalClose"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>

    <!-- 左侧栏导航 + 右侧表单（UI 布局；字段与现有一致） -->
    <div class="modal__body" style="display:flex;min-height:0">
      <div class="editor">
        <nav class="editor__nav" id="editorNav">
          <div class="editor__nav-sep">配置</div>
          <div class="editor__nav-item is-on" data-step="basic"><svg class="ic"><use href="#i-settings"/></svg> 基本配置</div>
          <div class="editor__nav-item" data-step="resource"><svg class="ic"><use href="#i-puzzle"/></svg> 资源挂载</div>
          <div class="editor__nav-sep">编制</div>
          <div class="editor__nav-item" data-step="members"><svg class="ic"><use href="#i-users"/></svg> 成员编排 <small>4</small></div>
          <div class="editor__nav-sep">运行</div>
          <div class="editor__nav-item" data-step="strategy"><svg class="ic"><use href="#i-sliders"/></svg> 运行策略</div>
        </nav>
        <div class="editor__form" id="editorForm"></div>
      </div>
    </div>

    <div class="modal__foot">
      <button class="btn btn--ghost"><svg class="ic"><use href="#i-download"/></svg> 导出 JSON</button>
      <button class="btn btn--outline" id="btnCancel">取消</button>
      <button class="btn btn--solid">保存配置</button>
    </div>
  </div>
</div>

<div class="note">
  <b>编辑器侧栏</b>：基本配置 → 资源挂载 → 成员编排 → 运行策略<br/>
  协作模式放在「成员编排」顶部 · MCP 工具可折叠内滚 · 无知识库挂载
</div>

<script>
/* 头像占位（用户上传，非像素） */
function avatarBox(size, label){
  return `<div class="card__avatar" style="width:${size}px;height:${size}px;border-radius:${Math.round(size*0.27)}px">
    <svg class="ic ic--lg" style="opacity:.5"><use href="#i-users"/></svg>
  </div>`;
}
function crewAvatar(){
  return `<div class="card__crew-slot"><svg class="ic ic--sm" style="opacity:.45"><use href="#i-users"/></svg></div>`;
}

const SQUADS=[
  {name:'全栈交付小分队',mode:'编排式',modeCls:'pill--mode',live:'运行中',liveCls:'pill--live',
   desc:'从前端到后端到回归测试的一条龙交付，主管统一调度，成员按专长分工。',n:5},
  {name:'数据管道小队',mode:'流水线',modeCls:'pill--mode-pipe',live:'',liveCls:'',
   desc:'抽取 → 清洗 → 转换 → 加载，工位线性串流，前序产出自动喂后序。',n:3},
  {name:'投研调研小队',mode:'群聊',modeCls:'pill--mode-chat',live:'待决议',liveCls:'pill--live-warn',
   desc:'多角色圆桌辩论，主笔收口提炼共识，可把行动项转入编排执行。',n:5},
];

document.getElementById('grid').innerHTML=SQUADS.map(s=>`
  <div class="card">
    <div class="card__head">
      ${avatarBox(48)}
      <div class="card__titles">
        <div class="card__name">${s.name}</div>
        <div class="card__tags">
          <span class="pill ${s.modeCls}">${s.mode}</span>
          ${s.live?`<span class="pill ${s.liveCls}"><i class="dot"></i>${s.live}</span>`:''}
        </div>
      </div>
    </div>
    <div class="card__desc">${s.desc}</div>
    <div class="card__crew">
      ${Array.from({length:Math.min(s.n,5)},crewAvatar).join('')}
      ${s.n>5?`<span class="card__crew-more">+${s.n-5}</span>`:''}
    </div>
    <div class="card__foot">
      <button class="btn btn--soft btn--sm" style="flex:1"><svg class="ic ic--sm"><use href="#i-play"/></svg> 工作台</button>
      <button class="btn btn--ghost btn--icon btn--sm" title="编辑"><svg class="ic ic--sm"><use href="#i-pencil"/></svg></button>
      <button class="btn btn--ghost btn--icon btn--sm" title="打开空间目录"><svg class="ic ic--sm"><use href="#i-folder"/></svg></button>
      <button class="btn btn--danger-ghost btn--icon btn--sm" title="删除"><svg class="ic ic--sm"><use href="#i-trash"/></svg></button>
    </div>
  </div>
`).join('');

/* ===== 表单内容（结构与现有一致，仅 UI 重绘） ===== */
const PANES={
  basic:`
    <div class="field">
      <div class="field__label">团队头像</div>
      <div class="avatar-pick">
        <div class="avatar-pick__box">
          <svg class="ic ic--md"><use href="#i-upload"/></svg>
          <small>上传</small>
        </div>
        <div class="avatar-pick__meta">
          <div class="field__hint">支持 png / jpg，建议 512×512</div>
          <button class="btn btn--ghost btn--sm" style="align-self:flex-start"><svg class="ic ic--sm"><use href="#i-image"/></svg> 选择图片</button>
        </div>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <div class="field__label">名称</div>
        <input class="input" placeholder="例如：大A 投研小队"/>
      </div>
      <div class="field">
        <div class="field__label">调用标识 <span class="tip" title="保存后固定，外部 API 用此标识调用"><svg class="ic ic--sm"><use href="#i-info"/></svg></span></div>
        <div style="display:flex;gap:8px">
          <input class="input" value="fullstack-delivery-squad"/>
          <button class="btn btn--ghost btn--icon" title="重新生成"><svg class="ic"><use href="#i-refresh"/></svg></button>
        </div>
        <div class="field__hint">保存后该标识固定不变，外部系统凭此调度</div>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <div class="field__label">工作区目录</div>
        <input class="input" placeholder="/workspace/squad-fullstack"/>
      </div>
      <div class="field">
        <div class="field__label">允许文件输入</div>
        <div class="switch-row">
          <div>
            <div class="switch-row__t">支持文件输入</div>
            <div class="switch-row__d">随指令提交 / 画布输入节点挂载</div>
          </div>
          <div class="switch is-on" onclick="this.classList.toggle('is-on')"></div>
        </div>
      </div>
    </div>
    <div class="field">
      <div class="field__label">描述（可选）</div>
      <textarea class="textarea" placeholder="这个小分队负责什么？"></textarea>
    </div>
  `,

  members:`
    <div class="field">
      <div class="field__label">协作模式</div>
      <div class="segmented">
        <div class="segmented__item is-on"><svg class="ic ic--sm"><use href="#i-zap"/></svg> 编排式</div>
        <div class="segmented__item"><svg class="ic ic--sm"><use href="#i-git"/></svg> 流水线</div>
        <div class="segmented__item"><svg class="ic ic--sm"><use href="#i-msg"/></svg> 群聊</div>
      </div>
      <div class="field__hint">编排式：主管拆解委派 · 流水线：线性串流 · 群聊：轮流发言收口</div>
    </div>
    <div class="mode-note"><svg class="ic ic--sm"><use href="#i-info"/></svg> 当前模式：<b>编排式</b> — 主管拆解委派成员，逐子任务执行后汇总</div>
    <div class="field">
      <div class="field__label">大脑节点：主管智能体（Orchestrator）</div>
      <select class="select"><option>选择主导者（拆解任务规划）</option><option>主管</option></select>
      <div class="field__hint">独立于下方名单外，纯负责拆解任务规划</div>
    </div>
    <div class="field">
      <div class="field__label">成员编制</div>
      <div class="member-list">
        ${['前端开发','后端开发','测试 / QA','文档'].map((role,i)=>`
          <div class="member-card">
            <div class="member-card__av"><svg class="ic"><use href="#i-users"/></svg></div>
            <div class="member-card__info">
              <div class="member-card__name">${['前端开发','后端开发','测试','文档'][i]}</div>
              <div class="member-card__id">agent-${100+i}</div>
            </div>
            <div class="member-card__selects">
              <select class="select"><option>WORKER</option><option>CRITIC</option></select>
              <select class="select"><option>${role}</option></select>
            </div>
            <button class="member-card__del"><svg class="ic ic--sm"><use href="#i-trash"/></svg></button>
          </div>
        `).join('')}
        <div class="add-member">
          <select class="select"><option>添加成员智能体…</option></select>
          <button class="btn btn--soft btn--sm"><svg class="ic ic--sm"><use href="#i-plus"/></svg> 添加</button>
        </div>
      </div>
    </div>
  `,

  strategy:`
    <div class="field-row">
      <div class="field">
        <div class="field__label">工作流触发机制</div>
        <div class="switch-row">
          <div>
            <div class="switch-row__t">定时触发</div>
            <div class="switch-row__d">按 Cron 自动发起协作</div>
          </div>
          <div class="switch" onclick="this.classList.toggle('is-on')"></div>
        </div>
      </div>
      <div class="field">
        <div class="field__label">引擎容错保护</div>
        <div class="switch-row">
          <div>
            <div class="switch-row__t">失败自动重试</div>
            <div class="switch-row__d">单次失败最多重试 2 次</div>
          </div>
          <div class="switch is-on" onclick="this.classList.toggle('is-on')"></div>
        </div>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <div class="field__label">Token 防洪堤</div>
        <input class="input" value="50000" placeholder="0 = 不限"/>
        <div class="field__hint">达到 80% 告警一次，100% 停止并收尾保留产物</div>
      </div>
      <div class="field">
        <div class="field__label">最大轮次</div>
        <input class="input" value="8"/>
      </div>
    </div>
    <div class="switch-row">
      <div>
        <div class="switch-row__t">chat_then_execute</div>
        <div class="switch-row__d">群聊汇总产出行动项后，自动转为委派任务续跑编排式 Wave</div>
      </div>
      <div class="switch is-on" onclick="this.classList.toggle('is-on')"></div>
    </div>
    <div class="field">
      <div class="field__label">Cron 时间戳表达式</div>
      <input class="input" placeholder="0 9 * * 1-5"/>
    </div>
    <div class="field">
      <div class="field__label">自动触发伴随指令</div>
      <textarea class="textarea" placeholder="定时触发时附带的默认任务描述…"></textarea>
    </div>
  `,

  resource:`
    <div class="field">
      <div class="field__label">全局 MCP 服务扩展</div>
      <div class="field__hint" style="margin-bottom:10px">勾选服务与工具；工具过多时卡片内滚动，不撑爆页面</div>
      <div class="mcp-grid">
        <div class="mcp-card is-open">
          <div class="mcp-card__head" onclick="this.parentElement.classList.toggle('is-open')">
            <div class="mcp-card__title"><svg class="ic"><use href="#i-server"/></svg> <span>文件读写</span></div>
            <div class="switch is-on" onclick="event.stopPropagation();this.classList.toggle('is-on')"></div>
            <div class="mcp-card__count is-on">3/3</div>
            <svg class="ic ic--sm mcp-card__chev"><use href="#i-plus"/></svg>
          </div>
          <div class="mcp-card__tools">
            <div class="mcp-card__toolbar">
              <button onclick="event.stopPropagation()">全选</button>
              <button onclick="event.stopPropagation()">清空</button>
            </div>
            <div class="tool-row"><code>read_file</code><div class="switch is-on" onclick="this.classList.toggle('is-on')"></div></div>
            <div class="tool-row"><code>write_file</code><div class="switch is-on" onclick="this.classList.toggle('is-on')"></div></div>
            <div class="tool-row"><code>list_dir</code><div class="switch is-on" onclick="this.classList.toggle('is-on')"></div></div>
          </div>
        </div>
        <div class="mcp-card">
          <div class="mcp-card__head" onclick="this.parentElement.classList.toggle('is-open')">
            <div class="mcp-card__title"><svg class="ic"><use href="#i-server"/></svg> <span>网页搜索</span></div>
            <div class="switch is-on" onclick="event.stopPropagation();this.classList.toggle('is-on')"></div>
            <div class="mcp-card__count is-on">2/2</div>
            <svg class="ic ic--sm mcp-card__chev"><use href="#i-plus"/></svg>
          </div>
          <div class="mcp-card__tools">
            <div class="mcp-card__toolbar">
              <button onclick="event.stopPropagation()">全选</button>
              <button onclick="event.stopPropagation()">清空</button>
            </div>
            <div class="tool-row"><code>web_search</code><div class="switch is-on" onclick="this.classList.toggle('is-on')"></div></div>
            <div class="tool-row"><code>fetch_page</code><div class="switch" onclick="this.classList.toggle('is-on')"></div></div>
          </div>
        </div>
        <div class="mcp-card">
          <div class="mcp-card__head" onclick="this.parentElement.classList.toggle('is-open')">
            <div class="mcp-card__title"><svg class="ic"><use href="#i-server"/></svg> <span>数据库查询</span></div>
            <div class="switch" onclick="event.stopPropagation();this.classList.toggle('is-on')"></div>
            <div class="mcp-card__count">0/8</div>
            <svg class="ic ic--sm mcp-card__chev"><use href="#i-plus"/></svg>
          </div>
          <div class="mcp-card__tools">
            <div class="mcp-card__toolbar">
              <button onclick="event.stopPropagation()">全选</button>
              <button onclick="event.stopPropagation()">清空</button>
            </div>
            ${['query','execute','list_tables','describe_table','export_csv','import_csv','explain','kill_query'].map(t=>`
              <div class="tool-row"><code>${t}</code><div class="switch" onclick="this.classList.toggle('is-on')"></div></div>
            `).join('')}
          </div>
        </div>
      </div>
    </div>
  `,
};

function openEditor(kind){
  document.getElementById('mask').style.display='flex';
  document.getElementById('modalTitle').textContent=kind==='edit'?'编辑小分队':'新建小分队';
  document.getElementById('editorForm').innerHTML=PANES.basic;
  document.querySelectorAll('#editorNav .editor__nav-item').forEach((t,i)=>t.classList.toggle('is-on',i===0));
}

document.getElementById('btnCreate').onclick=()=>openEditor('create');
document.getElementById('modalClose').onclick=()=>document.getElementById('mask').style.display='none';
document.getElementById('btnCancel').onclick=()=>document.getElementById('mask').style.display='none';
document.getElementById('mask').addEventListener('click',e=>{
  if(e.target.id==='mask') document.getElementById('mask').style.display='none';
});

document.querySelectorAll('#editorNav .editor__nav-item').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('#editorNav .editor__nav-item').forEach(x=>x.classList.remove('is-on'));
    t.classList.add('is-on');
    document.getElementById('editorForm').innerHTML=PANES[t.dataset.step];
  });
});

document.addEventListener('click',e=>{
  const seg=e.target.closest('.segmented__item');
  if(seg){
    seg.parentElement.querySelectorAll('.segmented__item').forEach(x=>x.classList.remove('is-on'));
    seg.classList.add('is-on');
  }
});
</script>
</body>
</html>
