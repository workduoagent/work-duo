# 最小 CI（2026-09-25 设立）
# 三步：typecheck → cargo test → release gate（离线静态层）。
#
# 本地等效命令（推送前自检）：
#   pnpm typecheck
#   cargo test --manifest-path src-tauri/Cargo.toml
#   node .workspace/.sys_tool/workduo-mcp/scripts/release_gate.mjs --offline --version local
#
# 注：release gate 依赖仓库内的 .workspace/ 工具目录，该目录随仓库分发。
#     若改用浅克隆（--depth 1）请确认工具目录完整。

name: ci

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  rust-test:
    name: cargo test (windows, msvc)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo test
        run: cargo test --locked
        env:
          # Tauri/WebView2 相关构建在 CI 无窗口环境的标准开关
          CARGO_INCREMENTAL: 0

  release-gate-offline:
    name: release gate (offline static layer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: release gate --offline
        run: node .workspace/.sys_tool/workduo-mcp/scripts/release_gate.mjs --offline --version ci-${{ github.sha }}
