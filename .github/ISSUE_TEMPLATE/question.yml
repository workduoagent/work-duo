name: ❓ 使用问题
description: 使用过程中遇到疑问
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        一般性问题也可以去 [Discussions](https://github.com/workduoagent/work-duo/discussions) 提问，那里回复更快。

  - type: textarea
    id: question
    attributes:
      label: 你的问题
      description: 尽量描述清楚你做了什么、期望什么、实际是什么
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: 应用版本
      placeholder: "例如：v0.0.1"
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: false
