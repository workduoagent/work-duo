name: ✨ 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请说明你的使用场景，而不仅仅是「我想要 X」。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issue，没有重复
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 描述你现在遇到的困难或痛点
      placeholder: 我在……的时候，很不方便，因为……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你期望的方案
      description: 你希望项目怎么解决这个问题
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、参考链接等
    validations:
      required: false
