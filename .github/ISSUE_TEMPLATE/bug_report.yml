name: 🐛 Bug 反馈
description: 报告一个可复现的 Bug
title: "[Bug] "
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写完整信息，否则很难定位问题。

        **安全提醒**：若问题是凭证泄露、路径越界、沙箱逃逸等安全缺陷，请勿公开提 Issue，
        改用 [私密安全报告](https://github.com/workduoagent/work-duo/security/advisories/new)。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issue，没有重复
          required: true
        - label: 我使用的是最新版本
          required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清楚、简洁地描述这个 Bug
      placeholder: 发生了什么？你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 一步步写清楚，方便我们复现
      placeholder: |
        1. 打开应用
        2. 点击 '...'
        3. 看到报错
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: 系统版本
      placeholder: "例如：Windows 11 23H2 / macOS 14.4 / Ubuntu 22.04"
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: 应用版本
      placeholder: "例如：v0.0.1"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 报错信息
      description: |
        粘贴相关日志或截图（可直接拖拽图片）。

        日志位置（按本地日期滚动）：`logs/workduo.log.YYYY-MM-DD.log`
        沙箱审计日志：`logs/sandbox-audit.YYYY-MM-DD.log`

        ⚠️ 提交前请自行确认日志中不含 API Key、Token、内网地址等敏感信息。
      render: shell
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 其他可能有帮助的内容
    validations:
      required: false
