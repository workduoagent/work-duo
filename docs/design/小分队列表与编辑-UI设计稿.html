<!-- AI生成 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>小分队列表 & 编辑表单 · UI 设计稿</title>
<style>
/* Zinc + 晴空蓝（与工作台一致） */
:root{
  --bg:#ffffff; --bg-subtle:#fafafa; --bg-muted:#f4f4f5;
  --fg:#27272a; --fg-muted:#71717a; --fg-intense:#18181b;
  --border:#e4e4e7; --border-muted:#f4f4f5;
  --brand-50:#f0f9ff; --brand-100:#e0f2fe; --brand-200:#bae6fd;
  --brand-300:#7dd3fc; --brand-400:#38bdf8; --brand-500:#0ea5e9; --brand-600:#0284c7;
  --brand-700:#0369a1; --brand-800:#075985;
  --success:#16a34a; --success-50:#dcfce7;
  --warning:#d97706; --warning-50:#fef3c7;
  --danger:#ef4444; --danger-50:#fee2e2;
  --lilac:#8b5cf6; --lilac-50:#f5f3ff;
  --shadow-sm:0 2px 12px rgba(0,0,0,.03);
  --shadow-md:0 8px 32px rgba(0,0,0,.05);
  --shadow-pop:0 16px 48px rgba(0,0,0,.1);
  --radius:12px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--fg);font-size:13px;line-height:1.5;overflow:hidden}

.page{display:flex;flex-direction:column;height:100vh;padding:20px 28px 28px;overflow-y:auto}

/* ===== 页头 ===== */
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}
.head__title{font-size:22px;font-weight:700;color:var(--fg-intense);letter-spacing:-.02em}
.head__lead{margin:6px 0 0;font-size:13.5px;color:var(--fg-muted);max-width:520px;line-height:1.65}
.head__actions{display:flex;align-items:center;gap:10px;flex:none}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border-radius:10px;border:1px solid transparent;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:600;
  padding:0 16px;height:36px;transition:.15s;white-space:nowrap;
}
.btn--solid{background:var(--brand-600);color:#fff;box-shadow:0 2px 8px color-mix(in srgb,var(--brand-500) 30%,transparent)}
.btn--solid:hover{background:var(--brand-700)}
.btn--soft{background:var(--brand-50);color:var(--brand-700);border-color:var(--brand-200)}
.btn--soft:hover{background:var(--brand-100)}
.btn--ghost{background:transparent;color:var(--fg-muted);border-color:var(--border)}
.btn--ghost:hover{border-color:var(--brand-300);color:var(--brand-700);background:var(--brand-50)}
.btn--outline{background:var(--bg);color:var(--fg);border-color:var(--border)}
.btn--danger-ghost{background:transparent;color:var(--danger);border-color:transparent}
.btn--danger-ghost:hover{background:var(--danger-50)}
.btn--sm{height:32px;padding:0 12px;font-size:12px}
.btn--icon{width:34px;height:34px;padding:0}
.btn--icon.btn--sm{width:28px;height:28px}

.pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;
}
.pill--mode{background:var(--brand-100);color:var(--brand-800)}
.pill--mode-pipe{background:#ecfeff;color:#0e7490}
.pill--mode-chat{background:var(--lilac-50);color:#5b21b6}
.pill--live{background:var(--success-50);color:#16a34a}
.pill--live-warn{background:var(--warning-50);color:var(--warning)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill--live .dot{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ===== 卡片网格 ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:16px;
}
.card{
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
  display:flex;flex-direction:column;gap:14px;
  transition:.18s;
  cursor:default;
}
.card:hover{
  border-color:var(--brand-300);
  box-shadow:var(--shadow-md);
  transform:translateY(-2px);
}
.card__head{display:flex;align-items:center;gap:12px}
.card__avatar{
  width:48px;height:48px;border-radius:13px;flex:none;
  background:linear-gradient(135deg,var(--brand-100),var(--brand-50));
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.card__avatar svg,.card__avatar img{width:100%;height:100%;object-fit:cover}
.card__titles{min-width:0;flex:1}
.card__name{
  font-size:15px;font-weight:700;color:var(--fg-intense);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card__tags{display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap}
.card__desc{
  font-size:12.5px;color:var(--fg-muted);line-height:1.65;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  min-height:40px;
}
/* 像素成员条 */
.card__crew{display:flex;align-items:center;height:30px;gap:0}
.card__crew-slot{
  width:28px;height:28px;border-radius:8px;overflow:hidden;
  background:var(--bg-muted);border:2px solid var(--bg);
  margin-left:-7px;flex:none;
  display:flex;align-items:center;justify-content:center;
}
.card__crew-slot:first-child{margin-left:0}
.card__crew-more{
  margin-left:8px;font-size:11px;font-weight:600;color:var(--fg-muted);
}
.card__foot{
  display:flex;align-items:center;gap:8px;
  padding-top:14px;border-top:1px solid var(--border-muted);
  margin-top:auto;
}
.card__foot .btn--solid{flex:1}

/* ===== 弹窗遮罩 ===== */
.mask{
  position:fixed;inset:0;z-index:100;
  background:rgba(24,24,27,.4);
  backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;
  padding:24px;
}
.modal{
  width:min(920px,100%);max-height:calc(100vh - 48px);
  background:var(--bg);border-radius:18px;
  box-shadow:var(--shadow-pop);
  display:flex;flex-direction:column;overflow:hidden;
}
.modal__head{
  display:flex;align-items:flex-start;gap:14px;
  padding:22px 26px 18px;
  border-bottom:1px solid var(--border-muted);
}
.modal__title{font-size:17px;font-weight:700;color:var(--fg-intense)}
.modal__desc{margin-top:4px;font-size:12.5px;color:var(--fg-muted)}
.modal__close{
  margin-left:auto;width:32px;height:32px;border-radius:9px;
  border:1px solid var(--border);background:var(--bg);
  cursor:pointer;color:var(--fg-muted);font-size:15px;
  display:flex;align-items:center;justify-content:center;
}
.modal__close:hover{background:var(--bg-muted);color:var(--fg)}
.modal__body{flex:1;min-height:0;overflow-y:auto;display:flex}
.modal__foot{
  display:flex;align-items:center;justify-content:flex-end;gap:10px;
  padding:16px 26px;border-top:1px solid var(--border-muted);
  background:var(--bg-subtle);
}

/* ===== 编辑器：左侧步骤 + 右侧表单 ===== */
.editor{display:flex;min-height:0;width:100%}
.editor__nav{
  width:180px;flex:none;padding:18px 12px;
  border-right:1px solid var(--border-muted);
  background:var(--bg-subtle);
  display:flex;flex-direction:column;gap:4px;
}
.editor__nav-item{
  display:flex;align-items:center;gap:9px;
  padding:10px 12px;border-radius:10px;
  font-size:13px;font-weight:600;color:var(--fg-muted);
  cursor:pointer;transition:.12s;border:1.5px solid transparent;
}
.editor__nav-item:hover{background:var(--bg);color:var(--fg)}
.editor__nav-item.is-on{
  background:var(--brand-50);color:var(--brand-800);
  border-color:var(--brand-200);
}
.editor__nav-item i{font-style:normal;font-size:14px}
.editor__nav-item small{
  margin-left:auto;font-size:10px;font-weight:600;
  background:var(--brand-600);color:#fff;
  padding:1px 6px;border-radius:999px;
}
.editor__form{
  flex:1;min-width:0;padding:22px 26px 28px;
  overflow-y:auto;display:flex;flex-direction:column;gap:18px;
}

/* 表单字段 */
.field{display:flex;flex-direction:column;gap:6px}
.field__label{
  font-size:12.5px;font-weight:650;color:var(--fg-intense);
  display:flex;align-items:center;gap:5px;
}
.field__label .tip{
  font-size:10px;color:var(--fg-muted);font-weight:400;
  cursor:help;
}
.field__hint{font-size:11px;color:var(--fg-muted);line-height:1.5}
.input,.select,.textarea{
  width:100%;border:1.5px solid var(--border);border-radius:10px;
  padding:10px 12px;font-family:inherit;font-size:13px;
  color:var(--fg);background:var(--bg);outline:none;transition:.15s;
}
.input:focus,.select:focus,.textarea:focus{
  border-color:var(--brand-500);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-500) 18%,transparent);
}
.input::placeholder,.textarea::placeholder{color:var(--fg-muted);opacity:.65}
.textarea{resize:vertical;min-height:80px;line-height:1.6}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field-row--3{grid-template-columns:1fr 1fr 1fr}

/* 模式选择卡 */
.mode-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mode-card{
  border:1.5px solid var(--border);border-radius:12px;
  padding:14px;cursor:pointer;transition:.15s;background:var(--bg);
  text-align:left;
}
.mode-card:hover{border-color:var(--brand-300)}
.mode-card.is-on{
  border-color:var(--brand-600);
  background:var(--brand-50);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-500) 18%,transparent);
}
.mode-card__ico{font-size:20px;margin-bottom:6px}
.mode-card__t{font-size:13px;font-weight:700;color:var(--fg-intense)}
.mode-card__d{font-size:11px;color:var(--fg-muted);margin-top:3px;line-height:1.5}

/* 头像上传 */
.avatar-pick{
  display:flex;align-items:center;gap:14px;
}
.avatar-pick__box{
  width:64px;height:64px;border-radius:16px;
  border:2px dashed var(--brand-300);
  background:var(--brand-50);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;overflow:hidden;flex:none;
  transition:.15s;
}
.avatar-pick__box:hover{border-color:var(--brand-500);background:var(--brand-100)}
.avatar-pick__box svg{width:52px;height:52px}
.avatar-pick__meta{display:flex;flex-direction:column;gap:4px}

/* 成员列表 */
.member-list{display:flex;flex-direction:column;gap:10px}
.member-card{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;
  border:1.5px solid var(--border);border-radius:12px;
  background:var(--bg);transition:.15s;
}
.member-card:hover{border-color:var(--brand-300);box-shadow:var(--shadow-sm)}
.member-card__pa{
  width:42px;height:42px;border-radius:11px;overflow:hidden;
  background:var(--bg-muted);flex:none;
  display:flex;align-items:center;justify-content:center;
}
.member-card__info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.member-card__name{font-size:13px;font-weight:650;color:var(--fg-intense)}
.member-card__role{font-size:11px;color:var(--fg-muted)}
.member-card__selects{display:flex;gap:8px;flex:none}
.member-card__selects .select{width:140px;padding:7px 10px;font-size:12px}
.member-card__del{
  width:28px;height:28px;border-radius:8px;border:none;
  background:transparent;color:var(--fg-muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.member-card__del:hover{background:var(--danger-50);color:var(--danger)}

.add-member{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;border:1.5px dashed var(--border);
  border-radius:12px;background:var(--bg-subtle);
}
.add-member .select{flex:1}

/* 开关行 */
.switch-row{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:12px 14px;border:1.5px solid var(--border);
  border-radius:12px;background:var(--bg);
}
.switch-row__t{font-size:13px;font-weight:650;color:var(--fg-intense)}
.switch-row__d{font-size:11px;color:var(--fg-muted);margin-top:2px}
.switch{
  width:40px;height:22px;border-radius:999px;
  background:var(--border);position:relative;cursor:pointer;
  transition:.15s;flex:none;
}
.switch::after{
  content:'';position:absolute;top:2px;left:2px;
  width:18px;height:18px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);
  transition:.15s;
}
.switch.is-on{background:var(--brand-600)}
.switch.is-on::after{left:20px}

/* 模式提示条 */
.mode-note{
  display:flex;align-items:center;gap:8px;
  padding:10px 13px;border-radius:10px;
  background:var(--brand-50);border:1px solid var(--brand-200);
  font-size:12px;color:var(--brand-800);
}
.mode-note b{font-weight:700}

/* 资源标签 */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:550;
  border:1px solid var(--border);background:var(--bg-subtle);color:var(--fg-muted);
  cursor:pointer;
}
.chip:hover{border-color:var(--brand-300);color:var(--brand-700)}
.chip.is-on{background:var(--brand-600);border-color:var(--brand-600);color:#fff}

/* 空态 */
.empty{
  text-align:center;padding:64px 20px;color:var(--fg-muted);
}
.empty__ico{
  width:64px;height:64px;border-radius:18px;margin:0 auto 14px;
  background:var(--brand-50);border:2px dashed var(--brand-200);
  display:flex;align-items:center;justify-content:center;font-size:28px;
}
.empty__t{font-size:15px;font-weight:650;color:var(--fg-intense)}
.empty__d{font-size:12.5px;margin-top:6px}

/* 模板下拉 */
.tpl-select{
  height:36px;border:1.5px solid var(--border);border-radius:10px;
  padding:0 12px;font-family:inherit;font-size:13px;
  background:var(--bg);color:var(--fg);min-width:150px;
}

/* PixelAgent */
.pixel-agent{display:block;image-rendering:pixelated}
.pixel-agent .pa-fb{opacity:0}
.pixel-agent.is-motion.pixel-agent--working .pa-fa,
.pixel-agent.is-motion.pixel-agent--waiting .pa-fa,
.pixel-agent.is-motion.pixel-agent--speaking .pa-fa{animation:pa-show-a .5s steps(1,end) infinite}
.pixel-agent.is-motion.pixel-agent--working .pa-fb,
.pixel-agent.is-motion.pixel-agent--waiting .pa-fb,
.pixel-agent.is-motion.pixel-agent--speaking .pa-fb{animation:pa-show-b .5s steps(1,end) infinite}
@keyframes pa-show-a{0%,49.9%{opacity:1}50%,100%{opacity:0}}
@keyframes pa-show-b{0%,49.9%{opacity:0}50%,100%{opacity:1}}

.note{
  position:fixed;left:16px;bottom:12px;z-index:200;
  background:rgba(24,24,27,.9);color:#fafafa;
  font-size:11px;padding:8px 12px;border-radius:8px;
  max-width:360px;line-height:1.6;pointer-events:none;
}
.note b{color:#7dd3fc}
</style>
</head>
<body>
<div class="page">
  <!-- 页头 -->
  <header class="head">
    <div>
      <h1 class="head__title">小分队协作</h1>
      <p class="head__lead">把多个智能体编成协作小组，按需选择编排式 / 流水线 / 群聊，协同攻克复杂任务。</p>
    </div>
    <div class="head__actions">
      <select class="tpl-select" id="tplSel">
        <option value="">⭐ 从模板新建</option>
        <option>⭐ 全栈交付小队</option>
        <option>⭐ 数据管道小队</option>
        <option>⭐ 调研小队</option>
      </select>
      <button class="btn btn--soft" id="btnApi">⚙ API 服务</button>
      <button class="btn btn--solid" id="btnCreate">＋ 新建小分队</button>
    </div>
  </header>

  <!-- 卡片网格 -->
  <div class="grid" id="grid"></div>
</div>

<!-- 新建 / 编辑弹窗 -->
<div class="mask" id="mask" style="display:none">
  <div class="modal">
    <div class="modal__head">
      <div>
        <div class="modal__title" id="modalTitle">新建小分队</div>
        <div class="modal__desc">组合多个智能体，按不同协作模式协同完成复杂任务。</div>
      </div>
      <button class="modal__close" id="modalClose">✕</button>
    </div>
    <div class="modal__body">
      <div class="editor">
        <!-- 左侧步骤 -->
        <nav class="editor__nav" id="editorNav">
          <div class="editor__nav-item is-on" data-step="basic"><i>⚙</i> 基本配置</div>
          <div class="editor__nav-item" data-step="members"><i>👥</i> 成员与编排 <small>3</small></div>
          <div class="editor__nav-item" data-step="strategy"><i>🎛</i> 运行策略</div>
          <div class="editor__nav-item" data-step="resource"><i>🧩</i> 资源挂载</div>
        </nav>
        <!-- 右侧表单 -->
        <div class="editor__form" id="editorForm"></div>
      </div>
    </div>
    <div class="modal__foot">
      <button class="btn btn--ghost" id="btnExport">导出 JSON</button>
      <button class="btn btn--outline" id="btnCancel">取消</button>
      <button class="btn btn--solid" id="btnSave">保存配置</button>
    </div>
  </div>
</div>

<div class="note">
  <b>列表 + 编辑表单设计</b>：白底 Zinc · 卡片悬浮 · 像素成员条<br/>
  编辑器左侧步骤导航 · 模式卡片选择 · 成员像素头像<br/>
  点「新建小分队」看表单
</div>

<script>
/* ========== PixelAgent ========== */
const PALETTE={
  skin:{fair:'#FBE8DC',warm1:'#F6D7B0',warm2:'#E8B88A',tan:'#D9A066',deep:'#C68642',cool:'#E0C3A0'},
  hair:{ink:'#1E1B14',brown:'#3D2B1F',chestnut:'#8B5A2B',amber:'#C47B2C',indigo:'#3D4F8C',rose:'#A64D63',silver:'#B8BEC4'},
  outfit:{indigo:'#3D4F8C',emerald:'#2F6B4F',amber:'#C47B2C',rose:'#A64D63',sky:'#4A90C4',wine:'#7B3B4B',dark:'#3C4043',mid:'#6B7075',light:'#E8EAED',ink:'#1E1B14'},
};
function pixelAgentSVG({size=32,gender='male',skin='warm2',hair='ink',top='indigo',bottom='dark',shoes='ink',accessory='none',state='idle'}={}){
  const S=PALETTE.skin[skin]||PALETTE.skin.warm2,H=PALETTE.hair[hair]||PALETTE.hair.ink;
  const T=PALETTE.outfit[top]||PALETTE.outfit.indigo,B=PALETTE.outfit[bottom]||PALETTE.outfit.dark;
  const SH=PALETTE.outfit[shoes]||PALETTE.outfit.ink;
  const FACE='#2A2320';
  let eyes=`<rect x="13" y="10" width="2" height="2" fill="${FACE}"/><rect x="19" y="10" width="2" height="2" fill="${FACE}"/>`;
  let mouth=`<rect x="15" y="13" width="3" height="1" fill="${FACE}"/>`;
  const hairRects=gender==='female'
    ?`<rect x="10" y="4" width="12" height="3" fill="${H}"/><rect x="9" y="6" width="2" height="8" fill="${H}"/><rect x="21" y="6" width="2" height="8" fill="${H}"/><rect x="11" y="6" width="10" height="2" fill="${H}"/>`
    :`<rect x="11" y="4" width="10" height="3" fill="${H}"/><rect x="10" y="6" width="12" height="2" fill="${H}"/>`;
  let acc='';
  if(accessory==='glasses') acc=`<rect x="12" y="10" width="4" height="2" fill="none" stroke="${FACE}" stroke-width="0.5"/><rect x="18" y="10" width="4" height="2" fill="none" stroke="${FACE}" stroke-width="0.5"/>`;
  else if(accessory==='headset') acc=`<rect x="9" y="8" width="1" height="5" fill="#3C4043"/><rect x="22" y="8" width="1" height="5" fill="#3C4043"/><rect x="11" y="4" width="10" height="1" fill="#3C4043"/>`;
  return `<svg class="pixel-agent" width="${size}" height="${size}" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <rect x="11" y="26" width="4" height="4" fill="${B}"/><rect x="17" y="26" width="4" height="4" fill="${B}"/>
    <rect x="10" y="29" width="5" height="3" fill="${SH}"/><rect x="17" y="29" width="5" height="3" fill="${SH}"/>
    <rect x="10" y="18" width="12" height="8" fill="${T}"/>
    <rect x="14" y="16" width="4" height="2" fill="${S}"/>
    <rect x="11" y="5" width="10" height="11" fill="${S}"/><rect x="10" y="6" width="12" height="9" fill="${S}"/>

function openEditor(kind){
  document.getElementById('mask').style.display='flex';
  document.getElementById('modalTitle').textContent=kind==='edit'?'编辑小分队':'新建小分队';
  document.getElementById('editorForm').innerHTML=FORMS.basic();
  document.querySelectorAll('#editorNav .editor__nav-item').forEach((n,i)=>{
    n.classList.toggle('is-on',i===0);
  });
}

function pickMode(el){
  el.parentElement.querySelectorAll('.mode-card').forEach(x=>x.classList.remove('is-on'));
  el.classList.add('is-on');
}

document.getElementById('btnCreate').onclick=()=>openEditor('create');
document.getElementById('modalClose').onclick=()=>document.getElementById('mask').style.display='none';
document.getElementById('btnCancel').onclick=()=>document.getElementById('mask').style.display='none';
document.getElementById('mask').addEventListener('click',(e)=>{
  if(e.target.id==='mask') document.getElementById('mask').style.display='none';
});

document.querySelectorAll('#editorNav .editor__nav-item').forEach(n=>{
  n.addEventListener('click',()=>{
    document.querySelectorAll('#editorNav .editor__nav-item').forEach(x=>x.classList.remove('is-on'));
    n.classList.add('is-on');
    document.getElementById('editorForm').innerHTML=FORMS[n.dataset.step]();
  });
});

/* 轻交互 */
document.addEventListener('click',(e)=>{
  if(e.target.classList?.contains('chip')) e.target.classList.toggle('is-on');
});
